version: "3.9"

services:
  mongo:
    image: mongo:7
    container_name: ai-hub-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:latest
    container_name: ai-hub-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - WEBHOOK_URL=http://localhost:5678
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

volumes:
  mongo_data:
  n8n_data:
